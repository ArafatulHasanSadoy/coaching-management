name: coaching_ops
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.2.0
  characters: ^1.4.1
  cryptography: ^2.9.0
  csv: ^8.0.0
  drift: ^2.35.0
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.0
  go_router: ^17.5.0
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  webview_flutter: ^4.14.1
  xml: ^7.0.1

# Bundle SQLite3MultipleCiphers instead of stock SQLite, so the database can be
# encrypted at rest with `PRAGMA key`. Replaces the discontinued
# sqlcipher_flutter_libs (drift >= 2.32 + sqlite3 3.x handle bundling directly).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
